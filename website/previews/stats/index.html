<!doctype html>
<html lang="zh-CN" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>统计 · Audcore</title>
  <link rel="stylesheet" href="./stats.css">
  <script type="module" src="./stats.mjs"></script>
</head>
<body>
  <main id="terminal" aria-label="声核静态统计界面预览">
    <div class="toolbar"><strong>Audcore <span>统计</span></strong><span id="period"></span><time id="generated"></time><fieldset class="theme"><legend>主题</legend><label><input type="radio" name="theme" value="light">亮</label><label><input type="radio" name="theme" value="dark" checked>暗</label></fieldset></div>
    <div id="load-error" role="alert" hidden>统计快照暂不可用，请刷新重试</div>

    <section class="metrics" id="metrics" aria-label="统计概览"></section>

    <div class="workspace">
      <section class="panel devices" aria-labelledby="devices-title">
        <div class="panel-head"><div><h1 id="devices-title">声卡 / 驱动</h1></div><span class="panel-count" id="device-count"></span></div>
        <div class="table-tools"><label class="search"><span>⌕</span><input id="device-search" type="search" placeholder="搜索声卡型号、驱动" aria-label="搜索声卡型号、驱动" autocomplete="off"></label><label class="filter">类型 <select id="device-type"><option value="">全部</option><option>ASIO</option><option>WASAPI</option></select></label></div>
        <div class="table-space"><table id="device-table"><caption>声卡安装样本排行</caption><colgroup><col class="rank-col"><col><col class="device-users"><col class="share-col"><col class="buffer-col"><col class="rate-col"></colgroup><thead><tr><th>#</th><th data-key="name"><button type="button">声卡 / 驱动</button></th><th data-key="users" aria-sort="descending"><button type="button">检出 ↓</button></th><th data-key="runningUsers" title="有运行配置记录的安装样本"><button type="button">运行</button></th><th data-key="buffer"><button type="button">缓冲 fr</button></th><th data-key="rate"><button type="button">kHz</button></th></tr></thead><tbody></tbody></table><p class="empty" id="device-empty" hidden>没有匹配的声卡，试试其他关键词</p></div>
        <div class="table-foot"><nav aria-label="声卡分页"><span id="device-page"></span><button id="device-prev" type="button" aria-label="声卡上一页">←</button><button id="device-next" type="button" aria-label="声卡下一页">→</button></nav></div>
      </section>

      <section class="panel plugins" aria-labelledby="plugins-title">
        <div class="panel-head"><div><h2 id="plugins-title">效果器</h2></div><span class="panel-count" id="plugin-count"></span></div>
        <div class="table-tools"><label class="search"><span>⌕</span><input id="plugin-search" type="search" placeholder="搜索效果器、厂商" aria-label="搜索效果器、厂商" autocomplete="off"></label><label class="filter">排序 <select id="plugin-order"><option value="users">安装样本</option><option value="sampled">处理样本</option><option value="mean">处理均耗</option><option value="name">名称</option></select></label><select id="perf-condition" aria-label="性能采样条件" title="诊断采样；CPU、版本与参数未统一，不作横向性能排名"></select></div>
        <div class="table-space"><table id="plugin-table"><caption>效果器安装量与诊断处理样本，缺失字段为空</caption><colgroup><col class="rank-col"><col><col class="vendor-col"><col class="user-col"><col class="user-col"><col class="perf-col"><col class="perf-col"></colgroup><thead><tr><th>#</th><th data-key="name"><button type="button">效果器</button></th><th data-key="vendor"><button type="button">厂商</button></th><th data-key="users" aria-sort="descending"><button type="button">安装 ↓</button></th><th data-key="sampled" title="所选条件下有处理记录的安装数"><button type="button">处理样本</button></th><th data-key="mean" title="各安装最新诊断均耗再平均，不是中位数"><button type="button">均耗 μs</button></th><th data-key="peak" title="保留采样中的最大峰值，不是 P95"><button type="button">峰值 μs</button></th></tr></thead><tbody></tbody></table><p class="empty" id="plugin-empty" hidden>没有匹配的效果器，试试名称或厂商</p></div>
        <div class="table-foot"><nav aria-label="效果器分页"><span id="plugin-page"></span><button id="plugin-prev" type="button" aria-label="效果器上一页">←</button><button id="plugin-next" type="button" aria-label="效果器下一页">→</button></nav></div>
      </section>

      <section class="panel buffer-panel" aria-labelledby="buffer-title"><div class="small-head"><h2 id="buffer-title">缓冲</h2><span>frames</span></div><div id="buffer-chart" class="columns" aria-label="缓冲帧数分布"></div></section>
      <section class="panel rate-panel" aria-labelledby="rate-title"><div class="small-head"><h2 id="rate-title">采样率</h2><span>kHz</span></div><div id="rate-chart" class="horizontal"></div></section>
      <section class="panel trend-panel" aria-labelledby="trend-title"><div class="small-head"><h2 id="trend-title">每日启动安装数</h2><span id="trend-range"></span></div><div id="trend-chart" class="trend"></div></section>
      <section class="panel version-panel" aria-label="版本或厂商分布"><div class="small-head"><select id="distribution" aria-label="分布内容"><option value="versions">声核版本</option><option value="vendors">效果器厂商</option></select><span id="distribution-unit"></span></div><div id="version-chart" class="horizontal"></div></section>
    </div>

    <dialog id="detail-dialog" aria-labelledby="detail-title"><div class="dialog-head"><div><h2 id="detail-title"></h2></div><button type="button" data-close aria-label="关闭详情">×</button></div><div id="detail-content"></div></dialog>
  </main>
  <noscript>请启用 JavaScript 查看统计</noscript>
</body>
</html>
